<svg xmlns="http://www.w3.org/2000/svg" width="150" height="150" viewBox="-80 -80 160 160" role="img" aria-labelledby="t">
<title id="t">Recon-Stack: un radar che scopre host e servizi nelle reti di un progetto</title>
<defs>
  <radialGradient id="glow" cx="0" cy="0" r="70" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#0f766e" stop-opacity="0.5"/>
    <stop offset="1" stop-color="#0f766e" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="disc"><circle r="70"/></clipPath>
</defs>

<!-- disco del radar -->
<circle r="70" fill="#0b1220"/>
<circle r="70" fill="url(#glow)"/>

<!-- anelli concentrici: si disegnano all'avvio -->
<g fill="none" stroke="#1f5f57" stroke-width="1.5">
  <circle r="70" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" dur="0.8s" values="1;0" fill="freeze"/></circle>
  <circle r="48" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" begin="0.15s" dur="0.7s" values="1;0" fill="freeze"/></circle>
  <circle r="26" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1"><animate attributeName="stroke-dashoffset" begin="0.3s" dur="0.6s" values="1;0" fill="freeze"/></circle>
</g>
<g stroke="#1f5f57" stroke-width="1" opacity="0.6">
  <line x1="-70" y1="0" x2="70" y2="0"/>
  <line x1="0" y1="-70" x2="0" y2="70"/>
</g>

<!-- host scoperti: pulsano come blip sul radar -->
<g clip-path="url(#disc)">
  <g transform="translate(34,-22)">
    <circle fill="#2dd4bf" opacity="0"><animate attributeName="r" begin="1s" dur="1.8s" values="2;14" repeatCount="indefinite"/><animate attributeName="opacity" begin="1s" dur="1.8s" values="0.5;0" repeatCount="indefinite"/></circle>
    <circle r="3.4" fill="#2dd4bf" opacity="0"><animate attributeName="opacity" begin="1s" dur="0.3s" values="0;1" fill="freeze"/></circle>
  </g>
  <g transform="translate(-42,16)">
    <circle fill="#2dd4bf" opacity="0"><animate attributeName="r" begin="1.5s" dur="1.8s" values="2;14" repeatCount="indefinite"/><animate attributeName="opacity" begin="1.5s" dur="1.8s" values="0.5;0" repeatCount="indefinite"/></circle>
    <circle r="3.4" fill="#2dd4bf" opacity="0"><animate attributeName="opacity" begin="1.5s" dur="0.3s" values="0;1" fill="freeze"/></circle>
  </g>
  <g transform="translate(22,42)">
    <circle fill="#f59e0b" opacity="0"><animate attributeName="r" begin="2s" dur="1.8s" values="2;14" repeatCount="indefinite"/><animate attributeName="opacity" begin="2s" dur="1.8s" values="0.55;0" repeatCount="indefinite"/></circle>
    <circle r="3.4" fill="#f59e0b" opacity="0"><animate attributeName="opacity" begin="2s" dur="0.3s" values="0;1" fill="freeze"/></circle>
  </g>
  <g transform="translate(-22,-42)">
    <circle fill="#ef4444" opacity="0"><animate attributeName="r" begin="2.5s" dur="1.8s" values="2;14" repeatCount="indefinite"/><animate attributeName="opacity" begin="2.5s" dur="1.8s" values="0.6;0" repeatCount="indefinite"/></circle>
    <circle r="3.6" fill="#ef4444" opacity="0"><animate attributeName="opacity" begin="2.5s" dur="0.3s" values="0;1" fill="freeze"/></circle>
  </g>
  <g transform="translate(52,30)">
    <circle fill="#2dd4bf" opacity="0"><animate attributeName="r" begin="3s" dur="1.8s" values="2;12" repeatCount="indefinite"/><animate attributeName="opacity" begin="3s" dur="1.8s" values="0.45;0" repeatCount="indefinite"/></circle>
    <circle r="3" fill="#2dd4bf" opacity="0"><animate attributeName="opacity" begin="3s" dur="0.3s" values="0;1" fill="freeze"/></circle>
  </g>
</g>

<!-- sweep del radar: un raggio luminoso che gira, con la scia dietro -->
<g clip-path="url(#disc)" opacity="0">
  <animate attributeName="opacity" begin="0.9s" dur="0.3s" values="0;1" fill="freeze"/>
  <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3.4s" repeatCount="indefinite"/>
  <path d="M0 0 L70 0 A70 70 0 0 0 49.5 -49.5 Z" fill="#2dd4bf" opacity="0.14"/>
  <line x1="0" y1="0" x2="70" y2="0" stroke="#5eead4" stroke-width="2" stroke-linecap="round"/>
  <circle r="2.5" fill="#5eead4"/>
</g>
</svg>
