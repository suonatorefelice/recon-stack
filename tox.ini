# tox crea un ambiente Python pulito, ci installa il pacchetto e le
# dipendenze, ed esegue i test. È lo strumento usato dai progetti OpenStack:
# garantisce che i test passino partendo da zero, non solo sul computer di chi
# li ha scritti.
#
#   tox -e py3      esegue i test unitari (non serve OpenStack)

[tox]
minversion = 4.0.0
envlist = py3

[testenv]
usedevelop = True
deps =
  -r{toxinidir}/requirements.txt
  -r{toxinidir}/test-requirements.txt
commands = pytest {posargs:recon_stack/tests/unit}
