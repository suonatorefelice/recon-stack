# Descrizione del pacchetto, letta da pbr (vedi setup.py).

[metadata]
name = recon-stack
summary = Service discovery senza agenti per OpenStack
description_file = README.md
author = suonatorefelice
home_page = https://github.com/suonatorefelice/recon-stack
python_requires = >=3.10
classifier =
    Environment :: OpenStack
    Programming Language :: Python :: 3

[files]
# La cartella con il codice Python del servizio.
packages =
    recon_stack

[entry_points]
# Comandi installati insieme al pacchetto: ognuno diventa un programma
# eseguibile che chiama la funzione main() del modulo indicato.
console_scripts =
    recon-stack-dbsync = recon_stack.cmd.dbsync:main
# Le opzioni di configurazione del servizio, esposte allo strumento
# oslo-config-generator che produce il file di esempio in etc/.
oslo.config.opts =
    recon_stack = recon_stack.conf:list_opts
# Plugin tempest: tempest lo scopre da questo entry point quando il pacchetto è
# installato nel suo ambiente, e ne esegue i test sul percorso completo.
tempest.test_plugins =
    recon_tests = recon_stack.tests.tempest.plugin:ReconTempestPlugin
