# Descrizione del pacchetto, letta da pbr (vedi setup.py).

[metadata]
name = recon-stack
summary = Service discovery senza agenti per OpenStack
description_file = README.md
author = suonatorefelice
home_page = https://github.com/suonatorefelice/recon-stack
python_requires = >=3.10
classifier =
    Environment :: OpenStack
    Programming Language :: Python :: 3

[files]
# La cartella con il codice Python del servizio.
packages =
    recon_stack

[entry_points]
# Comandi installati insieme al pacchetto: "recon-stack-scanner" diventa un
# programma eseguibile che chiama la funzione main() del modulo indicato.
# È quello che il plugin DevStack avvia come servizio recon-scanner.
console_scripts =
    recon-stack-scanner = recon_stack.cmd.scanner:main
    recon-stack-dbsync = recon_stack.cmd.dbsync:main
    recon-stack-inventory = recon_stack.cmd.inventory:main
    recon-stack-scan = recon_stack.cmd.scan:main
# Le opzioni di configurazione del servizio, esposte allo strumento
# oslo-config-generator che produce il file di esempio in etc/.
oslo.config.opts =
    recon_stack = recon_stack.conf:list_opts
# Plugin dell'OpenStackClient: dichiara il client "recon" (make_client in
# plugin.py) e i comandi "openstack recon ...". OSC li scopre da questi entry
# point. Il nome del comando con gli underscore diventa parole: "recon_host_list"
# -> `openstack recon host list`.
openstack.cli.extension =
    recon = recon_stack.osc.plugin
openstack.recon.v1 =
    recon_host_list = recon_stack.osc.commands:ListHost
    recon_host_show = recon_stack.osc.commands:ShowHost
    recon_service_list = recon_stack.osc.commands:ListService
    recon_scan_list = recon_stack.osc.commands:ListScan
    recon_scan_show = recon_stack.osc.commands:ShowScan
    recon_scan_start = recon_stack.osc.commands:StartScan
